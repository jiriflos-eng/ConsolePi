<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConsolePi+ se znovu spouští</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #eff5f4; color: #142727; font: 500 18px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 34rem); padding: 2.5rem; text-align: center; background: #fff; border: 1px solid #d8e6e3; border-radius: 1.5rem; box-shadow: 0 1rem 3rem #153b3320; }
    .spinner { width: 3rem; height: 3rem; margin: 0 auto 1.4rem; border: .32rem solid #d8eeea; border-top-color: #0b8578; border-radius: 50%; animation: spin .8s linear infinite; }
    h1 { margin: 0 0 .7rem; font-size: 1.55rem; }
    p { margin: .4rem 0; color: #627878; }
    small { display: block; margin-top: 1.2rem; color: #879a99; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>ConsolePi+ se znovu spouští</h1>
    <p>Aktualizace nebo restart webové služby právě dokončuje poslední krok.</p>
    <p>Není nutné nic opakovat. Za okamžik vás vrátím na přehled zařízení.</p>
    <small>Pokud se stránka nevrátí do 60 sekund, obnovte ji ručně.</small>
  </main>
  <script>window.setTimeout(() => window.location.replace('/'), 5000);</script>
</body>
</html>
