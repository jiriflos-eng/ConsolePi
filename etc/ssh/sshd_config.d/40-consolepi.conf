# Spravováno balíkem ConsolePi. Port 22 zůstává pro administraci.
Port 22
Port 2201
Port 2202
Port 2203
Port 2204

# Každý konzolový port explicitně používá ForceCommand.
Match User console LocalPort 2201
    ForceCommand /usr/local/sbin/consolepi-session
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no

Match User console LocalPort 2202
    ForceCommand /usr/local/sbin/consolepi-session
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no

Match User console LocalPort 2203
    ForceCommand /usr/local/sbin/consolepi-session
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no

Match User console LocalPort 2204
    ForceCommand /usr/local/sbin/consolepi-session
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no

# Bezpečnostní síť: účet console nikdy nezíská shell ani na portu 22 či portu,
# který administrátor přidá později. Wrapper neznámý lokální port odmítne.
Match User console
    ForceCommand /usr/local/sbin/consolepi-session
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no

