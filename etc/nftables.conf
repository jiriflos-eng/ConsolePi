#!/usr/sbin/nft -f

flush ruleset

table inet consolepi_filter {
    set management_ipv4_networks {
        type ipv4_addr
        flags interval
        elements = { MANAGEMENT_CIDR }
    }

    set console_ssh_ports {
        type inet_service
        elements = { 22, 2201, 2202, 2203, 2204 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state invalid drop
        ct state established,related accept

        # ICMP je potřebné i pro běžnou diagnostiku a správnou funkci IPv6.
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # MANAGEMENT_CIDR je při instalaci nahrazen aktuální Ethernet sítí.
        # Další položky allowlistu spravuje ConsolePi ve stejném nftables setu.
        ip saddr @management_ipv4_networks tcp dport @console_ssh_ports ct state new accept
        ip saddr @management_ipv4_networks tcp dport 80 ct state new accept
        ip saddr @management_ipv4_networks tcp dport 443 ct state new accept

        counter log prefix "nft-input-drop: " level info limit rate 5/second drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
