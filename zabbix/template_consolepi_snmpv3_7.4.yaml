zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 6c4e3b64905d4ccaa77299443a714701
      name: 'Templates/Applications'
  templates:
    - uuid: b497148078444d30a6f3d905beea628c
      template: 'ConsolePi by SNMPv3'
      name: 'ConsolePi+ by SNMPv3'
      description: |
        Monitors ConsolePi+ through its read-only SNMPv3 authPriv interface.

        Configure SNMPv3 credentials on each host interface. This template
        deliberately contains no usernames, authentication passphrases, or
        privacy passphrases.

        OID root: 1.3.6.1.4.1.55555.1
        ConsolePi+ MIB: CONSOLEPI-MIB.txt
      groups:
        - name: 'Templates/Applications'
      items:
        - uuid: a8f4a6bb466f448a94f50521810b1938
          name: 'CPU utilization'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.55555.1.1.0]'
          key: consolepi.cpu.utilization
          units: '%'
          description: 'MIB: CONSOLEPI-MIB::consolePiCpuPercent'
          tags:
            - tag: component
              value: cpu
        - uuid: 526a385c1a3c49ffac1aec1c5d2830dc
          name: 'CPU temperature'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.55555.1.2.0]'
          key: consolepi.cpu.temperature
          value_type: FLOAT
          units: °C
          description: 'MIB: CONSOLEPI-MIB::consolePiCpuTemperatureDeciC. ConsolePi+ exports tenths of degrees Celsius.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: temperature
        - uuid: 9c5f00e4a8ab4f1e929aa599033a4f65
          name: 'Memory used'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.55555.1.3.0]'
          key: consolepi.memory.used
          value_type: UNSIGNED
          units: B
          description: 'MIB: CONSOLEPI-MIB::consolePiMemoryUsedBytes'
          tags:
            - tag: component
              value: memory
        - uuid: c07ff03ad6624a6aa3f3bca98b8d227a
          name: 'Memory total'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.55555.1.4.0]'
          key: consolepi.memory.total
          value_type: UNSIGNED
          units: B
          description: 'MIB: CONSOLEPI-MIB::consolePiMemoryTotalBytes'
          tags:
            - tag: component
              value: memory
        - uuid: 5574bb4c597b4b0da3b448ca18c5aa20
          name: 'Memory utilization'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.55555.1.5.0]'
          key: consolepi.memory.utilization
          units: '%'
          description: 'MIB: CONSOLEPI-MIB::consolePiMemoryUsedPercent'
          tags:
            - tag: component
              value: memory
        - uuid: 05a3e55be9e54da991443b6c0be4a8a2
          name: 'Root filesystem used'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.55555.1.6.0]'
          key: consolepi.fs.used
          value_type: UNSIGNED
          units: B
          description: 'MIB: CONSOLEPI-MIB::consolePiDiskUsedBytes'
          tags:
            - tag: component
              value: storage
        - uuid: 987625364a5a4ab486c1b107f7b91c90
          name: 'Root filesystem total'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.55555.1.7.0]'
          key: consolepi.fs.total
          value_type: UNSIGNED
          units: B
          description: 'MIB: CONSOLEPI-MIB::consolePiDiskTotalBytes'
          tags:
            - tag: component
              value: storage
        - uuid: 12c5aa480bcf4b96b879df54aa02b263
          name: 'Root filesystem utilization'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.55555.1.8.0]'
          key: consolepi.fs.utilization
          units: '%'
          description: 'MIB: CONSOLEPI-MIB::consolePiDiskUsedPercent'
          tags:
            - tag: component
              value: storage
        - uuid: 7a62fb63d56c42e8b268b0ee9295a556
          name: Uptime
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.55555.1.9.0]'
          key: consolepi.uptime
          value_type: FLOAT
          units: uptime
          description: 'MIB: CONSOLEPI-MIB::consolePiUptime. SNMP TimeTicks are converted from centiseconds to seconds.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 062e8d647c634968a72e1e8bf86da024
          name: 'Available package updates'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.55555.1.10.0]'
          key: consolepi.updates.available
          value_type: UNSIGNED
          description: 'MIB: CONSOLEPI-MIB::consolePiAvailableUpdates. Value is cached from the scheduled ConsolePi+ update check; SNMP never triggers APT operations.'
          tags:
            - tag: component
              value: updates
        - uuid: 7d1171bd0f41488d91abbd168a8cc066
          name: 'Reboot required after updates'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.55555.1.11.0]'
          key: consolepi.updates.reboot_required
          valuemap:
            name: 'ConsolePi+ yes/no'
          description: 'MIB: CONSOLEPI-MIB::consolePiRebootRequired'
          tags:
            - tag: component
              value: updates
        - uuid: 2a20af7319ca4d0f9d6787b26b242383
          name: 'Ethernet link state'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.55555.1.12.0]'
          key: consolepi.network.eth0.state
          valuemap:
            name: 'ConsolePi+ Ethernet link state'
          description: 'MIB: CONSOLEPI-MIB::consolePiEthernetLinkState'
          tags:
            - tag: component
              value: network
      discovery_rules:
        - uuid: e389726f75e74a93a79279a379054cf3
          name: 'ConsolePi+ service discovery'
          type: SNMP_AGENT
          # Zabbix supplies {#SNMPINDEX} automatically from the table
          # instance. It must not be declared as a second discovery macro.
          snmp_oid: 'discovery[{#SERVICE},1.3.6.1.4.1.55555.1.20.1.1.2]'
          key: consolepi.service.discovery
          delay: 1h
          description: 'MIB: CONSOLEPI-MIB::consolePiServiceTable'
          item_prototypes:
            - uuid: 9d7c2bf934534c7a9904c4fbdc43f6b9
              name: '{#SERVICE}: service state'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.55555.1.20.1.1.3.{#SNMPINDEX}]'
              key: 'consolepi.service.state[{#SNMPINDEX}]'
              valuemap:
                name: 'ConsolePi+ service state'
              description: 'MIB: CONSOLEPI-MIB::consolePiServiceState'
              tags:
                - tag: component
                  value: service
                - tag: service
                  value: '{#SERVICE}'
          trigger_prototypes:
            - uuid: 2280ce51b6244bcb84ce4b763c3a4d11
              expression: 'last(/ConsolePi by SNMPv3/consolepi.service.state[{#SNMPINDEX}])=2'
              name: 'ConsolePi+: Service {#SERVICE} is inactive'
              priority: HIGH
              description: 'ConsolePi+ reports this required systemd service as inactive.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 4b533a5e97f64808a8b435c03a9608c5
          name: 'ConsolePi+ serial-console discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#CONSOLE},1.3.6.1.4.1.55555.1.30.1.1.2]'
          key: consolepi.serial.discovery
          delay: 1h
          description: 'MIB: CONSOLEPI-MIB::consolePiSerialPortTable. The SNMP index is the SSH port number.'
          item_prototypes:
            - uuid: c7a835e24b534d909379a8b317218cb2
              name: '{#CONSOLE}: serial-console state (SSH {#SNMPINDEX})'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.55555.1.30.1.1.3.{#SNMPINDEX}]'
              key: 'consolepi.serial.state[{#SNMPINDEX}]'
              valuemap:
                name: 'ConsolePi+ serial-console state'
              description: 'MIB: CONSOLEPI-MIB::consolePiSerialPortState'
              tags:
                - tag: component
                  value: serial
                - tag: console
                  value: '{#CONSOLE}'
          trigger_prototypes:
            - uuid: c4d134579a3a43b29ec689f6b7e59b29
              expression: 'last(/ConsolePi by SNMPv3/consolepi.serial.state[{#SNMPINDEX}])=2'
              name: 'ConsolePi+: Serial console {#CONSOLE} is disconnected'
              priority: WARNING
              description: 'The serial adapter assigned to this ConsolePi+ SSH port is not currently present.'
              tags:
                - tag: scope
                  value: availability
      macros:
        - macro: '{$CONSOLEPI.CPU.WARN}'
          value: '90'
          description: 'CPU utilization warning threshold in percent.'
        - macro: '{$CONSOLEPI.DISK.WARN}'
          value: '90'
          description: 'Root filesystem utilization warning threshold in percent.'
        - macro: '{$CONSOLEPI.UPDATES.WARN}'
          value: '1'
          description: 'Raise a warning when at least this many package updates are available.'
      valuemaps:
        - uuid: 7dfa2c5a0fdd4ecfb00b3a9611b27047
          name: 'ConsolePi+ service state'
          mappings:
            - value: '1'
              newvalue: Active
            - value: '2'
              newvalue: Inactive
        - uuid: 5f5d615c2e0c43cf8d0bf808e254c8af
          name: 'ConsolePi+ yes/no'
          mappings:
            - value: '0'
              newvalue: 'No'
            - value: '1'
              newvalue: 'Yes'
        - uuid: 8a6ce2194b304d7b8336a1eb3ef02f4e
          name: 'ConsolePi+ Ethernet link state'
          mappings:
            - value: '1'
              newvalue: Up
            - value: '2'
              newvalue: Down
        - uuid: a60b401d9b64488ab0f6b0aaf2cdc2d0
          name: 'ConsolePi+ serial-console state'
          mappings:
            - value: '1'
              newvalue: Unassigned
            - value: '2'
              newvalue: Disconnected
            - value: '3'
              newvalue: Connected
  triggers:
    - uuid: 4ce5562754dd4d21a70e4afbe3a764ee
      expression: 'min(/ConsolePi by SNMPv3/consolepi.cpu.utilization,5m)>{$CONSOLEPI.CPU.WARN}'
      name: 'ConsolePi+: High CPU utilization'
      priority: WARNING
      opdata: 'Current utilization: {ITEM.LASTVALUE1}'
      tags:
        - tag: scope
          value: performance
    - uuid: d98d539f80c4420abed90f07a21d4bea
      expression: 'last(/ConsolePi by SNMPv3/consolepi.fs.utilization)>{$CONSOLEPI.DISK.WARN}'
      name: 'ConsolePi+: Root filesystem is nearly full'
      priority: WARNING
      opdata: 'Current utilization: {ITEM.LASTVALUE1}'
      tags:
        - tag: scope
          value: capacity
    - uuid: 54c9b9fce1a544e4afac262c3a2e89d1
      expression: 'last(/ConsolePi by SNMPv3/consolepi.network.eth0.state)=2'
      name: 'ConsolePi+: Ethernet link is down'
      priority: HIGH
      tags:
        - tag: scope
          value: availability
    - uuid: b7c6a18bbca94dce885292a28f4c4689
      expression: 'last(/ConsolePi by SNMPv3/consolepi.updates.reboot_required)=1'
      name: 'ConsolePi+: Reboot is required after updates'
      priority: WARNING
      tags:
        - tag: scope
          value: maintenance
    - uuid: 4a4dac3e5d6a442ea33d307cfc23780e
      expression: 'last(/ConsolePi by SNMPv3/consolepi.updates.available)>={$CONSOLEPI.UPDATES.WARN}'
      name: 'ConsolePi+: Package updates are available'
      priority: INFO
      tags:
        - tag: scope
          value: maintenance
